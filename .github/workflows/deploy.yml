name: Deploy

# Migrations are a **gated step**, and the gate is a human.
#
# `03-database.md` and the phase list both ask for this, and the reason is that
# a migration is the one action in this pipeline that cannot be rolled back by
# redeploying the previous build. Code rolls back; a dropped column does not.
# So the deploy is two jobs with a GitHub environment between them: `migrate`
# waits on an approval, and `release` waits on `migrate`.
on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  # The same runtime CI verifies on. Two pipelines on two Node versions is a
  # way of proving one thing and shipping another.
  NODE_VERSION: '24'

concurrency:
  group: deploy-production
  # Never cancel a deploy in flight. Cancelling between the migration and the
  # release is how a schema gets ahead of the code that reads it.
  cancel-in-progress: false

jobs:
  migrate:
    name: apply migrations (gated)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # The approval gate. Configure `production-database` in Settings →
    # Environments with required reviewers; without them this runs unattended,
    # which defeats the point of the job existing.
    environment: production-database

    steps:
      # First, before anything is installed. An absent credential is a
      # configuration error, and finding it out three minutes in — from a
      # script whose message tells you to edit `.env.local`, which is advice for
      # a laptop and nonsense on a runner — is how a deploy wastes a reviewer's
      # approval. The value is never echoed; only its presence is.
      - name: Check the migration credential is configured
        env:
          DATABASE_URL: ${{ secrets.PRODUCTION_DATABASE_URL }}
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "::error title=PRODUCTION_DATABASE_URL is not set::Add it under Settings → Secrets and variables → Actions, or as an environment secret on 'production-database'. The value is the Supabase pooler URI: Project Settings → Database → Connection string → URI."
            exit 1
          fi
          echo "PRODUCTION_DATABASE_URL is present."

      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      # Printed before the approval is acted on, so the reviewer sees which
      # files are pending and their checksums rather than approving blind.
      - name: Show what would be applied
        run: pnpm db:migrate:dry

      - name: Apply
        run: pnpm db:migrate
        env:
          DATABASE_URL: ${{ secrets.PRODUCTION_DATABASE_URL }}

  release:
    name: build and release
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: migrate

    steps:
      # Every required variable at once, named, before anything is installed.
      #
      # `env.public.ts` and `env.server.ts` validate at boot with Zod, so a
      # missing one already fails the build — but it fails on the *first* one it
      # meets, which turns configuring a deploy into five pushes. The five below
      # are exactly the ones those two schemas mark required; nothing optional
      # is demanded here. No value is echoed.
      - name: Check the release secrets are configured
        env:
          NEXT_PUBLIC_APP_URL: ${{ secrets.NEXT_PUBLIC_APP_URL }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          DATABASE_URL: ${{ secrets.PRODUCTION_DATABASE_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          missing=""
          for name in NEXT_PUBLIC_APP_URL NEXT_PUBLIC_SUPABASE_URL \
                      NEXT_PUBLIC_SUPABASE_ANON_KEY SUPABASE_SERVICE_ROLE_KEY DATABASE_URL; do
            if [ -z "${!name}" ]; then
              missing="$missing $name"
            fi
          done

          # Optional to the schema, but the two cron routes refuse every request
          # without it — `withCron` treats an absent secret as misconfiguration
          # rather than waving the caller through. A warning, not a failure.
          if [ -z "$CRON_SECRET" ]; then
            echo "::warning title=CRON_SECRET is not set::The scheduled jobs will answer 401 to Vercel Cron until it is."
          fi

          if [ -n "$missing" ]; then
            echo "::error title=Missing release secrets::$missing — add them under Settings → Secrets and variables → Actions. DATABASE_URL comes from the secret named PRODUCTION_DATABASE_URL."
            exit 1
          fi
          echo "All required release secrets are present."

      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      # The same gates CI ran, run again against the exact commit being
      # released. CI proved the branch; this proves the artefact.
      - name: Verify
        run: |
          pnpm typecheck
          pnpm lint
          pnpm test

      - name: Build
        run: pnpm build
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          NEXT_PUBLIC_APP_URL: ${{ secrets.NEXT_PUBLIC_APP_URL }}
          NEXT_PUBLIC_VAPID_PUBLIC_KEY: ${{ secrets.NEXT_PUBLIC_VAPID_PUBLIC_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          DATABASE_URL: ${{ secrets.PRODUCTION_DATABASE_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          VAPID_SUBJECT: ${{ secrets.VAPID_SUBJECT }}
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}

      # The publish step itself is deliberately left as one command to fill in.
      # Which host this deploys to has not been decided (ARCHITECTURE.md O4),
      # and writing `vercel deploy` here would be inventing that decision rather
      # than recording that it is open.
      - name: Publish
        run: |
          echo "No deploy target is configured — see ARCHITECTURE.md O4."
          echo "Everything above this line ran: migrations applied under review,"
          echo "gates green, production build succeeded."
          exit 1
